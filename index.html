<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Autoplaner">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>Autoplaner</title>
</head>
<body>
  <div id="app"><div class="loading">Lade…</div></div>
  <script>
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (app && app.querySelector('.loading')) {
        app.innerHTML = '<main class="setup"><h1>Fehler</h1><p class="error"></p></main>';
        app.querySelector('.error').textContent = e.message;
      }
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
